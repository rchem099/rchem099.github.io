</style>
<script>
(() => {
  const root = document.getElementById("bureau-rayane");
  const panel = root.querySelector("#rayane-window");
  const title = panel.querySelector("h2");
  const content = panel.querySelector(".window-content");
  const close = panel.querySelector("button");
  const desk = root.querySelector(".desk-view");
  const cup = desk.querySelector(".coffee-art");
  const coffeeLabel = cup.querySelector(".coffee-label");
  const coffeeStatus = desk.querySelector(".coffee-status");
  let sipsLeft = 4;
  cup.addEventListener("click", () => {
    if (sipsLeft === 0) return;
    sipsLeft -= 1;
    cup.style.setProperty("--coffee-depth", `${(4 - sipsLeft) * 25}%`);
    if (sipsLeft === 0) {
      cup.dataset.empty = "";
      cup.setAttribute("aria-disabled", "true");
      cup.setAttribute("aria-label", "Cup empty");
      coffeeLabel.textContent = "Cup empty";
      coffeeStatus.textContent = "Cup empty.";
      return;
    }
    coffeeStatus.textContent = `Coffee level: ${sipsLeft * 25}%.`;
  });
  const desktop = root.querySelector(".desktop");
  const back = desktop.querySelector(".return-desk");
  const monitor = desk.querySelector('[data-desk="desktop"]');
  const screen = monitor.querySelector(".screen-preview");
  const desktopPreview = desktop.cloneNode(true);
  desktopPreview.querySelector("#rayane-window").remove();
  desktopPreview.querySelectorAll("[aria-controls]").forEach(button => button.removeAttribute("aria-controls"));
  desktopPreview.hidden = false;
  desktopPreview.inert = true;
  screen.append(desktopPreview);
  new ResizeObserver(([entry]) => {
    screen.style.setProperty("--desktop-scale", Math.min(entry.contentRect.width / 960, entry.contentRect.height / 600));
  }).observe(screen);
  const diplomaFrame = desk.querySelector(".diploma-frame");
  const diploma = desk.querySelector(".diploma-dialog");
  const diplomaImage = diplomaFrame.querySelector("img").cloneNode();
  diplomaImage.alt = "University of Ottawa diploma for Rayane Chemsi, Bachelor of Applied Science in Computer Engineering";
  diploma.append(diplomaImage);
  diplomaFrame.addEventListener("click", () => diploma.showModal());
  const book = desk.querySelector(".book-dialog");
  const phone = desk.querySelector(".phone-dialog");
  function clonePage(name) {
    return root.querySelector(`template[data-page="${name}"]`).content.cloneNode(true);
  }
  book.querySelectorAll("[data-book-page]").forEach(page => page.append(clonePage(page.dataset.bookPage)));
  phone.querySelector(".phone-body").append(clonePage("contact"));
  desk.querySelector('[data-desk="education"]').addEventListener("click", () => book.showModal());
  const deskPhone = desk.querySelector('[data-desk="contact"]');
  deskPhone.addEventListener("click", () => {
    const miniature = deskPhone.querySelector(".phone-art").getBoundingClientRect();
    phone.showModal();
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const enlarged = phone.getBoundingClientRect();
    const offsetX = miniature.left + miniature.width / 2 - enlarged.left - enlarged.width / 2;
    const offsetY = miniature.top + miniature.height / 2 - enlarged.top - enlarged.height / 2;
    phone.animate(
      [{ transform: `translate(${offsetX}px,${offsetY}px) scale(${miniature.width / enlarged.width}) rotate(10deg)` },
       { transform: "none" }],
      { duration: 320, easing: "cubic-bezier(.2,.75,.3,1)" }
    );
  });
  let stopGame = () => {};
  let active;
  monitor.addEventListener("click", () => {
    desktop.hidden = false;
    desk.hidden = true;
    back.focus();
  });
  back.addEventListener("click", () => {
    dismiss();
    desktop.hidden = true;
    desk.hidden = false;
    monitor.focus();
  });
  function dismiss() {
    if (!active) return;
    stopGame();
    panel.hidden = true;
    if (active.matches("[data-app]")) active.setAttribute("aria-expanded", "false");
    active.focus();
    active = undefined;
  }
  function openWindow(button, pageName, label) {
    if (active === button) return dismiss();
    if (active?.matches("[data-app]")) active.setAttribute("aria-expanded", "false");
    active = button;
    title.textContent = label;
    stopGame();
    content.replaceChildren(clonePage(pageName));
    if (pageName === "games") stopGame = setupGames(content);
    panel.dataset.view = pageName;
    panel.hidden = false;
    if (button.matches("[data-app]")) button.setAttribute("aria-expanded", "true");
    close.focus();
  }
  desktop.querySelectorAll("[data-app]").forEach(button => {
    button.addEventListener("click", () => openWindow(button, button.dataset.app, button.textContent.trim()));
  });
  function setupGames(windowContent) {
    const snakePanel = windowContent.querySelector('[data-game-panel="snake"]');
    const memoryPanel = windowContent.querySelector('[data-game-panel="memory"]');
    const gamePanels = windowContent.querySelectorAll("[data-game-panel]");
    const gameOptions = windowContent.querySelectorAll("[data-game]");
    const board = snakePanel.querySelector(".snake-board");
    const status = snakePanel.querySelector(".snake-status");
    const start = snakePanel.querySelector("[data-start]");
    const memory = memoryPanel.querySelector(".memory-board");
    const memoryStatus = memoryPanel.querySelector(".memory-status");
    const size = 12;
    const directions = { up: [0, -1], left: [-1, 0], down: [0, 1], right: [1, 0] };
    const keys = { ArrowUp: "up", ArrowLeft: "left", ArrowDown: "down", ArrowRight: "right" };
    const cells = Array.from({ length: size ** 2 }, () => document.createElement("span"));
    board.append(...cells);
    let snake, food, direction, nextDirection, timer, score;
    let firstCard, flipTimer, moves, matches;

    function stopSnake() {
      clearInterval(timer);
      timer = undefined;
    }
    function placeFood() {
      const free = cells.map((_, index) => index).filter(index => !snake.includes(index));
      food = free[Math.floor(Math.random() * free.length)];
    }
    function drawSnake() {
      cells.forEach((cell, index) => {
        cell.dataset.cell = index === snake[0] ? "head" :
          index === food ? "food" : snake.includes(index) ? "body" : "";
      });
    }
    function steer(key) {
      const [dx, dy] = directions[key];
      if (dx + direction[0] !== 0 || dy + direction[1] !== 0) nextDirection = [dx, dy];
    }
    function tick() {
      direction = nextDirection;
      const x = snake[0] % size + direction[0];
      const y = Math.floor(snake[0] / size) + direction[1];
      const target = y * size + x;
      const eating = target === food;
      const occupied = eating ? snake : snake.slice(0, -1);
      if (x < 0 || x >= size || y < 0 || y >= size || occupied.includes(target)) {
        stopSnake();
        status.textContent = `Game over · Score ${score}`;
        start.textContent = "Play again";
        return;
      }
      snake.unshift(target);
      if (eating) {
        score += 1;
        placeFood();
        status.textContent = `Score ${score}`;
      } else {
        snake.pop();
      }
      drawSnake();
      if (food === undefined) {
        stopSnake();
        status.textContent = `Board cleared · Score ${score}`;
        start.textContent = "Play again";
      }
    }
    function resetSnake() {
      snake = [75, 74, 73];
      score = 0;
      direction = nextDirection = directions.right;
      placeFood();
      drawSnake();
    }
    start.addEventListener("click", () => {
      stopSnake();
      resetSnake();
      start.textContent = "Restart";
      status.textContent = "Score 0";
      timer = setInterval(tick, 225);
    });
    snakePanel.querySelectorAll("[data-step]").forEach(button => {
      button.addEventListener("click", () => steer(button.dataset.step));
    });
    function playKeys(event) {
      if (timer === undefined || !keys[event.key]) return;
      event.preventDefault();
      steer(keys[event.key]);
    }

    function resetMemory() {
      clearTimeout(flipTimer);
      flipTimer = firstCard = undefined;
      moves = matches = 0;
      const cards = ["CPU", "RAM", "SSD", "USB", "CPU", "RAM", "SSD", "USB"];
      for (let index = cards.length - 1; index > 0; index -= 1) {
        const swap = Math.floor(Math.random() * (index + 1));
        [cards[index], cards[swap]] = [cards[swap], cards[index]];
      }
      memory.replaceChildren(...cards.map((value, index) => {
        const card = document.createElement("button");
        card.type = "button";
        const hide = () => {
          card.textContent = "?";
          card.setAttribute("aria-label", `Card ${index + 1}, face down`);
        };
        hide();
        card.addEventListener("click", () => {
          if (flipTimer !== undefined || firstCard?.card === card || card.dataset.match) return;
          card.textContent = value;
          card.setAttribute("aria-label", `Card ${index + 1}, ${value}`);
          if (!firstCard) {
            firstCard = { card, value, hide };
            return;
          }
          moves += 1;
          const previous = firstCard;
          firstCard = undefined;
          if (previous.value === value) {
            card.dataset.match = previous.card.dataset.match = "yes";
            matches += 1;
          } else {
            flipTimer = setTimeout(() => {
              previous.hide();
              hide();
              flipTimer = undefined;
            }, 750);
          }
          memoryStatus.textContent = matches === 4 ? `All pairs found in ${moves} moves.` : `${matches} / 4 pairs · ${moves} moves`;
        });
        return card;
      }));
      memoryStatus.textContent = "0 / 4 pairs";
    }
    memoryPanel.querySelector("[data-shuffle]").addEventListener("click", resetMemory);
    const grid = windowContent.querySelector(".tic-board");
    const gridStatus = windowContent.querySelector(".tic-status");
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    function resetGrid() {
      const marks = Array(9).fill("");
      let turn = "X";
      let finished = false;
      gridStatus.textContent = "X’s turn";
      grid.replaceChildren(...marks.map((_, index) => {
        const square = document.createElement("button");
        square.type = "button";
        square.textContent = "·";
        square.setAttribute("aria-label", `Square ${index + 1}, empty`);
        square.addEventListener("click", () => {
          if (finished || marks[index]) return;
          marks[index] = turn;
          square.textContent = turn;
          square.setAttribute("aria-label", `Square ${index + 1}, ${turn}`);
          const winningLine = wins.find(line => line.every(position => marks[position] === turn));
          if (winningLine) {
            finished = true;
            winningLine.forEach(position => { grid.children[position].dataset.win = ""; });
            gridStatus.textContent = `${turn} wins!`;
          } else if (marks.every(Boolean)) {
            finished = true;
            gridStatus.textContent = "Draw.";
          } else {
            turn = turn === "X" ? "O" : "X";
            gridStatus.textContent = `${turn}’s turn`;
          }
        });
        return square;
      }));
    }
    windowContent.querySelector("[data-tic-reset]").addEventListener("click", resetGrid);

    const target = windowContent.querySelector(".reaction-target");
    const reactionStatus = windowContent.querySelector(".reaction-status");
    let reactionTimer, readyTime;
    function resetReaction() {
      clearTimeout(reactionTimer);
      reactionTimer = readyTime = undefined;
      target.dataset.state = "idle";
      target.textContent = "Start";
    }
    target.addEventListener("click", () => {
      if (readyTime !== undefined) {
        reactionStatus.textContent = `${Math.round(performance.now() - readyTime)} ms`;
        resetReaction();
      } else if (reactionTimer !== undefined) {
        reactionStatus.textContent = "Too early. Try again.";
        resetReaction();
      } else {
        target.dataset.state = "waiting";
        target.textContent = "Wait…";
        reactionStatus.textContent = "Wait for the signal.";
        reactionTimer = setTimeout(() => {
          reactionTimer = undefined;
          target.dataset.state = "ready";
          target.textContent = "Tap now!";
          reactionStatus.textContent = "Go!";
          readyTime = performance.now();
        }, 1100 + Math.random() * 2300);
      }
    });

    gameOptions.forEach(button => {
      button.addEventListener("click", () => {
        const showSnake = button.dataset.game === "snake";
        if (!showSnake && timer !== undefined) {
          stopSnake();
          start.textContent = "Play again";
          status.textContent = `Paused · Score ${score}`;
        }
        if (button.dataset.game !== "reaction" && (reactionTimer !== undefined || readyTime !== undefined)) {
          resetReaction();
          reactionStatus.textContent = "Ready to play.";
        }
        gamePanels.forEach(section => { section.hidden = section.dataset.gamePanel !== button.dataset.game; });
        gameOptions.forEach(option => {
          option.setAttribute("aria-pressed", String(option === button));
        });
      });
    });
    resetSnake();
    resetMemory();
    resetGrid();
    document.addEventListener("keydown", playKeys);
    return () => {
      stopSnake();
      clearTimeout(flipTimer);
      resetReaction();
      document.removeEventListener("keydown", playKeys);
    };
  }
  close.addEventListener("click", dismiss);
  root.addEventListener("keydown", event => {
    if (event.key === "Escape") dismiss();
  });

})();
</script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    window.lucide?.createIcons();
  });
</script>
</body>
